name: Publish

# Publishes to PyPI when a release is published on GitHub, or when it is run by
# hand for a tag. PyPI trusts this workflow (a trusted publisher), so there is
# no token to store.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v0.3.0
        required: true
      dry_run:
        description: Only build and check the files, without publishing
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Check that the tag is the version of the package
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "The tag is $TAG, but the version of the package is $version."
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    needs: build
    if: github.event_name == 'release' || !inputs.dry_run
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/datakiln
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
