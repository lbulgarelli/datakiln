name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"
      - name: pylint
        run: pylint datakiln
      - name: flake8
        run: flake8 datakiln tests
      - name: dlint
        run: flake8 --select=DUO datakiln
