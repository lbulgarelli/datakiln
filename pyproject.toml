[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "datakiln"
version = "0.3.0.1"
description='Build a database from a repository of files.'
readme = "README.md"
authors = [
    { name="Lucas Bulgarelli", email="lucas.bulgarelli@hotmail.com" },
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "database", "dataset", "versioning", "dvc", "reproducibility", "etl",
    "postgresql",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "python-slugify>=8.0.0",
    "sqlalchemy<2.0.36",
    "alembic>=1.13",
    "python-decouple>=3.8",
    "pytest>=8.1",
    "psycopg2-binary>=2.9",
    "pycap>=2.6.0",
    "sqlalchemy-utils>=0.41.2",
    "sqlglot>=30.0.1",
    "more-itertools>=10.0.0",
    "networkx>=3.0",
    "sqlparse>=0.5.5",
    "dvc[ssh]>=3.60.1",
    "paramiko>=4.0.0",
    "tenacity>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/lbulgarelli/datakiln"
Documentation = "https://lbulgarelli.github.io/datakiln/"
Source = "https://github.com/lbulgarelli/datakiln"
Issues = "https://github.com/lbulgarelli/datakiln/issues"
Releases = "https://github.com/lbulgarelli/datakiln/releases"

[project.optional-dependencies]
test = [
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
]
lint = [
    "flake8>=7.0",
    "dlint>=0.14",
    "pylint>=3.0",
]
docs = [
    "sphinx>=7.2",
]

[project.scripts]
datakiln = "datakiln.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/datakiln",
    "/docs",
    "/tests",
    "/LICENSE",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["datakiln"]