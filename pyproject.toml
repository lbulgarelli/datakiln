[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "data-utils"
version = "0.1.88"
description='Data Utilities.'
readme = "README.md"
authors = [
    { name="Lucas Bulgarelli", email="lucas.bulgarelli@hotmail.com" },
]
license = "MIT"
keywords=["database", "utilities"]
dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "python-slugify>=8.0.0",
    "sqlalchemy>=2.0.0",
    "python-decouple>=3.8",
    "pytest>=8.1",
    "psycopg2-binary>=2.9",
    "pycap>=2.6.0",
    "sqlalchemy-utils>=0.41.2",
    "sqlglot>=30.0.1",
    "dvc[ssh]>=3.60.1",
    "paramiko>=4.0.0"
]

[project.scripts]
spam-cli = "spam:main_cli"
build_metadata = "data_utils.build_metadata:main"
build_table = "data_utils.build_table:main"
build_database = "data_utils.build_database:main"
build_dbms = "data_utils.build_dbms:main"