stages:
  - build
  - lint
  - test
  - document
  - push

include:
  - component: $CI_SERVER_FQDN/example/python-ci/base@0.1.3
  - component: $CI_SERVER_FQDN/example/python-ci/build@0.1.3
  - component: $CI_SERVER_FQDN/example/python-ci/lint@0.1.3
  - component: $CI_SERVER_FQDN/example/python-ci/test@0.1.3
  - component: $CI_SERVER_FQDN/example/python-ci/document@0.1.3
  - component: $CI_SERVER_FQDN/example/python-ci/push@0.1.3

.unit_tests:
  variables:
    POSTGRES_DB: test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
  services:
    - postgres
  before_script:
    - echo DB_USER=$POSTGRES_USER > .env
    - echo DB_HOST=postgres >> .env
    - echo DB_NAME=$POSTGRES_DB >> .env
